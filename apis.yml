aid: monolith-materials
name: Monolith Materials
description: 'Monolith (legally Monolith Inc., formerly Monolith Materials) is an American
  chemicals and advanced-materials manufacturer headquartered in Lincoln, Nebraska and founded
  in 2012. It is the first company to run methane pyrolysis at commercial scale, using an
  electrified thermal-plasma process to split natural gas or renewable biogas into solid carbon
  and clean hydrogen with no direct CO2 combustion. The solid carbon is finished into carbon
  black for tire, rubber, plastics, battery and electronics manufacturing, and the co-produced
  hydrogen is used on-site or converted into anhydrous ammonia. Monolith operates a demonstration
  plant in Redwood City, California and its commercial Olive Creek facility in Hallam, Nebraska,
  which since 2023 has supplied made-in-Nebraska carbon black to Goodyear. Monolith is a physical
  materials producer and sells industrial product, not software: it publishes no developer
  program, no public API, and no machine-readable API contract of any kind.'
